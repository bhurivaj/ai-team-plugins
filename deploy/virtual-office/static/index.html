<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ออฟฟิศเสมือน</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d2a; color: #f2f2f2; font-family: system-ui, "Noto Sans Thai", sans-serif; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  canvas { image-rendering: pixelated; background: #000; }
  :focus-visible { outline: 3px solid #f4d35e; outline-offset: 2px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 2px solid #f4d35e; background: #2d3142; color: #fff; cursor: pointer; }
  #lift { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2d3142ee; padding: 12px; border-radius: 8px; display: flex; gap: 8px; align-items: center; }
  #lift[hidden], #security[hidden], #toast[hidden] { display: none; }
  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #c0392b; padding: 10px 16px; border-radius: 6px; max-width: 90vw; }
  #security { position: fixed; right: 16px; top: 16px; max-width: min(520px, 92vw); max-height: 88vh; overflow: auto; background: #2d3142f2; padding: 14px; border-radius: 8px; }
  #security h2 { margin: 0 0 8px; font-size: 18px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
  th, td { border-bottom: 1px solid #555a70; padding: 6px 8px; text-align: left; }
  td.c, th.c { text-align: center; }
  input[type=checkbox] { width: 20px; height: 20px; }
  ul { margin: 0; padding-left: 18px; font-size: 13px; }
  a { color: #f4d35e; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" aria-label="แผนที่ออฟฟิศเสมือน ใช้ปุ่มลูกศรหรือ W A S D เพื่อเดิน" role="img"></canvas></div>
<div id="lift" role="group" aria-label="ลิฟต์" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="security" role="region" aria-label="ห้องความปลอดภัย" hidden></div>
<script src="/static/office.js"></script>
</body>
</html>
