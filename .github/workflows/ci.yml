name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan
        run: bash tests/secret_scan.sh
      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do python -m json.tool "$f" > /dev/null; done
      - name: Unit tests
        run: python -m unittest discover -s tests -v
